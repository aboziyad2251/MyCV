name: Deploy to VPS

# Every push to main redeploys the site on the VPS over SSH.
# Turned off until these repository secrets exist (Settings > Secrets and variables > Actions):
#   VPS_HOST     the VPS IP address
#   VPS_USER     SSH user (e.g. ubuntu); needs sudo without a password, or use root
#   VPS_SSH_KEY  private key whose public key is in that user's ~/.ssh/authorized_keys

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Skip when the VPS secrets are not set
        if: env.VPS_HOST == ''
        run: echo "VPS_HOST secret not set; skipping deploy."

      - name: Set up SSH
        if: env.VPS_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and restart on the VPS
        if: env.VPS_HOST != ''
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/aboziyad2251/MyCV/main/deploy/install.sh | sudo bash'
